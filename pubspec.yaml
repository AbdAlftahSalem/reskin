name: reskin
description: >-
  Debug-only Flutter dev tool: re-theme your running app from a prompt, seed
  color or logo, and X-ray every widget that uses a hardcoded color.
version: 0.2.0
repository: https://github.com/AbdAlftahSalem/reskin
issue_tracker: https://github.com/AbdAlftahSalem/reskin/issues
topics:
  - theme
  - color
  - dark-mode
  - material-design
  - devtools

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
