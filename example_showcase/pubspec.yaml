name: bunn_showcase
description: >-
  Bunn, a specialty coffee ordering app used to show reskin on a realistic,
  polished UI. Mostly theme-driven, with a few deliberately hardcoded colors
  for X-ray to find.
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  reskin:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
    - family: Cormorant Garamond
      fonts:
        - asset: assets/fonts/CormorantGaramond.ttf
    - family: El Messiri
      fonts:
        - asset: assets/fonts/ElMessiri.ttf
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono.ttf
    - family: DejaVu Serif
      fonts:
        - asset: assets/fonts/DejaVuSerif.ttf
